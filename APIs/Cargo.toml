[package]
name = "apis"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = {version="0.4.45",features=["serde"]}
dotenvy = "0.15.7"
nalgebra = "0.35.0"
serde = {version="1.0.229",features=["derive"]}
serde_json = "1.0.151"
sqlx = {version="0.9.0",features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork"]}
tokio = {version="1.53.1",features = ["full"]}
tower = "0.5.3"
tower-http = {version="0.7.1",features=["full"]}
tracing = "0.1.44"
tracing-subscriber = {version="0.3.23",features=["env-filter"]}
uuid = {version="1.26.1",features=["serde"]}
